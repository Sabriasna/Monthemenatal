<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Thème Astral</title>
  <link href="https://fonts.googleapis.com/css2?family=Agrandir&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Agrandir', sans-serif;
      background-color: #281a60;
      color: white;
      text-align: center;
      padding: 40px;
    }

    input, button, select {
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      font-size: 16px;
      border: none;
    }

    button {
      background-color: white;
      color: #281a60;
      cursor: pointer;
    }

    #resultat {
      margin-top: 30px;
      text-align: left;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    ul {
      list-style-type: none;
      padding-left: 0;
    }

    li {
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <h1>Découvre ton thème astral complet</h1>

  <form id="formulaire">
    <input type="text" id="prenom" placeholder="Ton prénom" required><br>
    <label for="date">Date de naissance :</label><br>
    <input type="date" id="date" required><br>
    <label for="heure">Heure de naissance :</label><br>
    <input type="time" id="heure" required><br>
    <input type="text" id="ville" placeholder="Ville de naissance" required><br>
    <button type="submit">Voir mon thème astral</button>
  </form>

  <div id="resultat"></div>

  <script>
    document.getElementById("formulaire").addEventListener("submit", async function(e) {
      e.preventDefault();

      const prenom = document.getElementById("prenom").value;
      const date = document.getElementById("date").value;
      const heure = document.getElementById("heure").value;
      const ville = document.getElementById("ville").value;

      const [year, month, day] = date.split("-");
      const [hour, minute] = heure.split(":");

      const geoResponse = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(ville)}`);
      const geoData = await geoResponse.json();

      if (!geoData || geoData.length === 0) {
        document.getElementById("resultat").innerText = "Ville introuvable. Réessaye.";
        return;
      }

      const lat = geoData[0].lat;
      const lon = geoData[0].lon;

      const url = "https://api.freeastrologyapi.com/v1/birth-chart";

      const payload = {
        year: parseInt(year),
        month: parseInt(month),
        date: parseInt(day),
        hours: parseInt(hour),
        minutes: parseInt(minute),
        seconds: 0,
        latitude: parseFloat(lat),
        longitude: parseFloat(lon),
      };

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer afig5KsRrE9qmaZ3d2DpK2W468M9OSo03wJkNX80"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!data || !data.sunSign) {
          document.getElementById("resultat").innerText = "Erreur : données incomplètes.";
          return;
        }

        let html = `<h2>${prenom}, voici ton thème astral :</h2>`;

        html += `<p><strong>Signe solaire :</strong> ${data.sunSign}</p>`;
        html += `<p><strong>Signe lunaire :</strong> ${data.moonSign}</p>`;
        html += `<p><strong>Ascendant :</strong> ${data.ascendant}</p>`;

        // Planètes
        if (data.planets && data.planets.length > 0) {
          html += `<h3>Planètes :</h3><ul>`;
          data.planets.forEach(planet => {
            html += `<li><strong>${planet.name}</strong> en ${planet.sign} à ${planet.degree}°</li>`;
          });
          html += `</ul>`;
        }

        // Maisons
        if (data.houses && data.houses.length > 0) {
          html += `<h3>Maisons astrologiques :</h3><ul>`;
          data.houses.forEach(house => {
            html += `<li><strong>Maison ${house.houseNumber}</strong> commence en ${house.sign} à ${house.degree}°</li>`;
          });
          html += `</ul>`;
        }

        // Aspects
        if (data.aspects && data.aspects.length > 0) {
          html += `<h3>Aspects planétaires :</h3><ul>`;
          data.aspects.forEach(aspect => {
            html += `<li>${aspect.planet1} <strong>${aspect.aspectType}</strong> ${aspect.planet2} (orbe : ${aspect.orb}°)</li>`;
          });
          html += `</ul>`;
        }

        document.getElementById("resultat").innerHTML = html;

      } catch (error) {
        console.error(error);
        document.getElementById("resultat").innerText = "Erreur lors de l’appel à l’API.";
      }
    });
  </script>

</body>
</html>
